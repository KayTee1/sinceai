<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review: {{TITLE}}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --red: #c2312b; --red-bg: #fdecea;
    --orange: #b35c00; --orange-bg: #fff3e0;
    --blue: #3f5596; --blue-bg: #eef1fa;
    --green: #1f7a3f; --green-bg: #e7f5ec;
    --grey: #6b6b66; --grey-bg: #efefeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-top: 16px; }
  .meta { color: var(--muted); font-size: 14px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 4px 0 16px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--grey-bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  .verdict { border-radius: 10px; padding: 14px 18px; font-size: 18px; font-weight: 600; }
  .verdict p { margin: 4px 0 0; font-size: 16px; font-weight: 400; color: var(--text); }
  .red { color: var(--red); background: var(--red-bg); }
  .orange { color: var(--orange); background: var(--orange-bg); }
  .blue { color: var(--blue); background: var(--blue-bg); }
  .green { color: var(--green); background: var(--green-bg); }
  .grey { color: var(--grey); background: var(--grey-bg); }
  .warn { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .issue { border-top: 1px solid var(--line); padding: 16px 0; }
  .issue:first-of-type { border-top: 0; padding-top: 0; }
  .issue:last-child { padding-bottom: 0; }
  .issue h3 { font-size: 17px; margin: 8px 0 4px; }
  .issue p { margin: 8px 0 0; }
  .issue b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  ul { margin: 0; padding-left: 20px; }
  li + li { margin-top: 6px; }
  .check { display: flex; gap: 10px; align-items: baseline; }
  .check + .check { margin-top: 8px; }
  .check small { color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  @media print { body { background: #fff; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<main>

  <div class="card">
    <div class="meta">{{TYPE}} &middot; {{TASK}} &middot; <code>{{BRANCH}}</code> &middot; {{DATE}}</div>
    <h1>{{TITLE}}</h1>
    {{VERDICT}}
    {{SELF_REVIEW_WARNING}}
  </div>

  <div class="card">
    <h2>What to fix</h2>
    {{FINDINGS}}
  </div>

  <div class="card">
    <h2>Checks</h2>
    {{CHECKS}}
  </div>

  <div class="card">
    <h2>Next steps</h2>
    {{NEXT_STEPS}}
  </div>

  <footer>Reviewed by {{REVIEWER}} &middot; ai-review template v2</footer>
</main>
</body>
</html>
